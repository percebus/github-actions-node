name: setup
description: setup node
inputs:
  node-version:
    description: node version
    required: false

    # SRC: https://nodejs.org/en/about/previous-releases
    # - "" is Maintenance LTS (18)
    # - "lts/*" is Active LTS (22)
    # - "latest" and "node" are Current (24)
    default: "lts/*"

outputs:
  version:
    description: "node --version"
    value: ${{ steps.node-version.outputs.node-version }}

runs:
  using: composite
  steps:
    - name: setup node @ ${{ inputs.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    
        # TODO
        # File containing the version Spec of the version to use.  Examples: package.json, mise.toml, .nvmrc, .node-version, .tool-versions.
        # If node-version and node-version-file are both provided the action will use version from node-version.
        node-version-file: ''

    - name: node version
      id: node-version
      shell: bash
      run: |
        node --version
        echo "version=$(echo node --version)" >> $GITHUB_OUTPUT
